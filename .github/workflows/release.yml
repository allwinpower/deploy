name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: bash ./build.sh

      - name: Package release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p release-assets

          tar -C dist/linux -czf "release-assets/deploy_${VERSION}_linux_amd64.tar.gz" deploy
          tar -C dist/macos-amd64 -czf "release-assets/deploy_${VERSION}_darwin_amd64.tar.gz" deploy
          tar -C dist/macos-arm64 -czf "release-assets/deploy_${VERSION}_darwin_arm64.tar.gz" deploy
          (
            cd dist/windows
            zip -9 "../../release-assets/deploy_${VERSION}_windows_amd64.zip" deploy.exe
          )

          (
            cd release-assets
            sha256sum deploy_* > checksums.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*
